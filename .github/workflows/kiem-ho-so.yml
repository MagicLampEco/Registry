# Cổng gác hồ sơ đăng ký.
#
# Vì sao có tệp này: nó gác thứ branch protection KHÔNG gác được — nội dung lời khai trong hồ
# sơ, và tính duy nhất `platform_id`. Ruleset chỉ chặn được ai đẩy vào đâu.
#
# ⚠ Câu cũ ở đây ghi "kho PRIVATE trên gói Free nên ruleset trả 403". Kho nay là PUBLIC
# (đo 2026-08-30: `gh api repos/MagicLampEco/Registry --jq .visibility` → `public`), nên lý do ấy
# đã hết đúng. Giữ workflow không phải vì thiếu lựa chọn khác, mà vì nó gác việc khác.
#
# Nó KHÔNG thay được người: căn cứ từ chối R3 ("khai không đúng sự thật") không kiểm bằng máy được,
# và "gây nhầm lẫn" ở R1 chỉ được nêu ra chứ không tự từ chối.

name: Kiểm hồ sơ đăng ký

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kiem:
    runs-on: ubuntu-latest
    steps:
      # Vì sao ghim số major và vì sao là 7: `@v4` chạy trên runtime Node 20, mà runner đã bỏ
      # Node 20 — action tự bị đẩy sang Node 24 kèm cảnh báo, tức là đang chạy trên thứ nó không
      # được kiểm. `checkout@v7` chặn checkout PR từ fork cho `pull_request_target` và
      # `workflow_run`; workflow này chỉ dùng `pull_request` nên không đụng.
      - uses: actions/checkout@v7

      # `setup-node@v5` trở đi tự bật cache khi `package.json` có trường `packageManager`.
      # Tệp đó KHÔNG có trường ấy (đo 2026-08-30), nên không có cache nào tự bật sau lưng.
      - uses: actions/setup-node@v7
        with:
          # Bằng đúng phiên bản mọi phép đo cục bộ chạy trên đó. Ghim '20' là để CI đo một thứ
          # khác với thứ người viết code đo — và Node 20 đã hết hạn hỗ trợ từ 2026-04.
          node-version: '24'

      - name: Cài phụ thuộc
        run: npm ci

      # Chấm hồ sơ + R1 (trùng `platform_id`). Thoát 1 khi sai hình dạng hoặc trùng khít.
      - name: Chấm hồ sơ đăng ký + kiểm trùng platform_id
        run: node tools/check-registration.mjs

      # Bộ kiểm khẳng định của tài liệu — sống TÁCH khỏi `npm test` có chủ ý: bộ test off-chain
      # không đọc thư mục hồ sơ, nên đổi tên một tệp hồ sơ không làm test nào đỏ (đo 2026-08-15
      # trên 202 test; số test đổi theo thời gian, cơ chế thì không).
      - name: Bộ kiểm khẳng định tài liệu
        run: bash tools/test-check.sh

      # Soát neo `tệp:dòng`. Vì sao đáng một bước CI riêng: 2026-09-02 đo được **259** neo đã trôi
      # cùng lúc, do chính mấy PR của kho này chèn hàm vào bốn tệp on-chain. Không phép đo nào cũ
      # kêu lên — neo trôi vẫn trỏ vào một dòng CÓ THẬT, nên mọi vòng rà bằng mắt và mọi phép kiểm
      # "dòng có tồn tại không" đều xanh. Đây là lớp lỗi chỉ máy bắt được, và chỉ bắt được nếu
      # phép kiểm soát NỘI DUNG chứ không soát sự tồn tại.
      # ⚠ Đọc đúng phạm vi: bước này chỉ phủ neo TRONG kho, và chỉ phủ neo có tên ký hiệu cạnh bên
      # (18/223 lúc thêm vào). "Xanh" KHÔNG có nghĩa mọi neo đều đúng — xem khối chú thích đầu tệp.
      - name: Soát neo tệp:dòng
        run: node tools/check-anchors.mjs

      - name: Bộ kiểm off-chain
        run: npm test

      # Vì sao tách khỏi `npm test`: vitest biên dịch TypeScript bằng esbuild, tức là NÉM BỎ kiểu
      # chứ không kiểm kiểu. Đo 2026-08-17 — gieo `const x: number = "chuỗi"` vào một tệp test:
      # vitest vẫn 206/206 xanh, chỉ `tsc` bắt (TS2322). Không có bước này thì mọi lỗi kiểu đi
      # thẳng qua CI, kể cả lệch giữa `check-registration-core.mjs` và tệp khai kiểu `.d.mts` của
      # nó — chỗ duy nhất giữ hai bản đó khớp nhau.
      - name: Kiểm kiểu
        run: npm run typecheck
